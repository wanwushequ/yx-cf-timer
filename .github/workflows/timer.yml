name: Refresh Worker Every 6 Hours

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Install Wrangler
        run: npm install -g wrangler
      
      - name: Get current version ID and rollback to itself
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          # 列出所有版本，获取第一个（最新）的版本 ID
          VERSIONS=$(npx wrangler versions list --json)
          LATEST_VERSION=$(echo "$VERSIONS" | jq -r '.[0].version_id')
          
          echo "当前最新版本: $LATEST_VERSION"
          
          # Rollback 到当前版本（会创建一个新的部署）
          npx wrangler rollback "$LATEST_VERSION"
          
          echo "✅ Worker 已刷新部署"