- name: Update environment variable via API
  env:
    CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
    CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    CF_WORKER_NAME: ${{ secrets.CF_WORKER_NAME }}
  run: |
    BEIJING_TIME=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')
    
    # 正确的 API 是 PATCH 方法，不是 PUT
    curl -X PATCH \
      "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts/${CF_WORKER_NAME}/bindings" \
      -H "Authorization: Bearer ${CF_API_TOKEN}" \
      -H "Content-Type: application/json" \
      -d "{
        \"bindings\": [{
          \"name\": \"LAST_REFRESH\",
          \"type\": \"plain_text\",
          \"text\": \"$BEIJING_TIME\"
        }]
      }" \
      --fail