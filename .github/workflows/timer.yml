name: Refresh Worker Every 6 Hours

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Update environment variable via API
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_WORKER_NAME: ${{ secrets.CF_WORKER_NAME }}
        run: |
          BEIJING_TIME=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')
          
          # 构建 settings 对象，包含要更新的 bindings
          SETTINGS=$(cat <<EOF
          {
            "bindings": [
              {
                "name": "LAST_REFRESH",
                "type": "plain_text",
                "text": "$BEIJING_TIME"
              }
            ]
          }
          EOF
          )
          
          # 使用 PATCH 方法调用 /settings 端点
          curl -X PATCH \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts/${CF_WORKER_NAME}/settings" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$SETTINGS" \
            --fail
          
          echo "✅ 环境变量已更新: LAST_REFRESH=$BEIJING_TIME"