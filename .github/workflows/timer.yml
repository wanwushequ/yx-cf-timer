name: Refresh Worker Every 6 Hours

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Update environment variable safely
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_WORKER_NAME: ${{ secrets.CF_WORKER_NAME }}
        run: |
          BEIJING_TIME=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')
          
          # 1. 先获取当前所有环境变量
          CURRENT=$(curl -s -X GET \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts/${CF_WORKER_NAME}/bindings" \
            -H "Authorization: Bearer ${CF_API_TOKEN}")
          
          # 2. 提取现有的 bindings，排除 LAST_REFRESH（稍后替换）
          OTHER_BINDINGS=$(echo "$CURRENT" | jq '[.result[] | select(.name != "LAST_REFRESH")]')
          
          # 3. 构建新的 bindings（保留原有的 + 更新 LAST_REFRESH）
          NEW_BINDINGS=$(echo "$OTHER_BINDINGS" | jq \
            --arg time "$BEIJING_TIME" \
            '. + [{"name": "LAST_REFRESH", "type": "plain_text", "text": $time}]')
          
          # 4. 提交更新
          curl -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts/${CF_WORKER_NAME}/bindings" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"bindings\": $NEW_BINDINGS}" \
            --fail
          
          echo "✅ 环境变量 LAST_REFRESH 已更新为: $BEIJING_TIME"
          echo "✅ 其他环境变量保持不变"