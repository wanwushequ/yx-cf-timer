name: Refresh Worker by Updating Env Var

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Update environment variable to trigger redeploy
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_WORKER_NAME: ${{ secrets.CF_WORKER_NAME }}
        run: |
          # 生成北京时间作为新的变量值
          BEIJING_TIME=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')
          
          # 通过 API 修改环境变量（这会触发部署）
          curl -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts/${CF_WORKER_NAME}/bindings" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{
              \"name\": \"LAST_REFRESH\",
              \"type\": \"plain_text\",
              \"text\": \"$BEIJING_TIME\"
            }"
          
          echo "✅ 环境变量 LAST_REFRESH 已更新为: $BEIJING_TIME"
          echo "✅ Worker 将在 30 秒内自动重新部署"