name: Refresh Worker Every 6 Hours

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Install Wrangler
        run: npm install -g wrangler
      
      - name: Update secret to trigger redeploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          BEIJING_TIME=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')
          
          # wrangler 会自动处理保留其他变量
          echo "$BEIJING_TIME" | npx wrangler secret put LAST_REFRESH \
            --name "${{ secrets.CF_WORKER_NAME }}" \
            --account-id "${{ secrets.CF_ACCOUNT_ID }}"
          
          echo "✅ 环境变量已更新: $BEIJING_TIME"