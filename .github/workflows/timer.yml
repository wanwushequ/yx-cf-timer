name: Touch Worker File

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  modify-comment:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 需要写入权限
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Update timestamp in _worker.js (Beijing Time)
        run: |
          # 获取北京时间（UTC+8）
          BEIJING_TIME=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')
          
          # 修改 worker.js 中的注释
          sed -i "s/\/\/ Last auto-trigger: .*/\/\/ Last auto-trigger: $BEIJING_TIME (Beijing Time)/" _worker.js
          
          echo "✅ Updated timestamp to: $BEIJING_TIME (北京时间)"
      
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _worker.js
          git diff --staged --quiet || git commit -m "chore: auto-trigger deploy at $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S') (Beijing Time)"
          git push
