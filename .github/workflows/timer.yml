name: Refresh Worker Every 6 Hours

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Install Wrangler
        run: npm install -g wrangler
      
      - name: Update secret to trigger redeploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          WORKER_NAME="${{ secrets.CF_WORKER_NAME }}"
          BEIJING_TIME=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')
          
          # 用 wrangler secret put，通过 --name 指定项目
          echo "$BEIJING_TIME" | npx wrangler secret put LAST_REFRESH \
            --name "$WORKER_NAME"
          
          echo "✅ Worker: $WORKER_NAME"
          echo "✅ Secret LAST_REFRESH 已更新为: $BEIJING_TIME"
          echo "✅ Worker 将自动重新部署"